<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Vento Diga Sud Chioggia</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  overflow: auto;

  font-family: Arial, sans-serif;

  background: #071923;
  color: white;
}

.app {
  width: 100%;
  min-height: 100vh;

  display: flex;
  flex-direction: column;
}

.header {
  height: 16vh;
  min-height: 70px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-bottom: 1px solid #31505d;
}

.header h1 {
  margin: 0;

  font-size: clamp(22px, 3vw, 38px);

  letter-spacing: 2px;

  text-align: center;
}

.content {
  flex: 1;

  min-height: 65vh;

  display: flex;
  align-items: stretch;
}

.panel {
  flex: 1;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  border-right: 1px solid #31505d;

  padding: 15px;
}

.panel:last-child {
  border-right: none;
}

.label {
  font-size: clamp(14px, 1.7vw, 22px);

  letter-spacing: 2px;

  opacity: 0.75;

  margin-bottom: 10px;

  text-align: center;
}

.value {
  font-size: clamp(42px, 7vw, 85px);

  font-weight: bold;
}

.unit {
  font-size: clamp(16px, 2vw, 26px);

  opacity: 0.75;
}

.direction {
  font-size: clamp(25px, 3.5vw, 48px);

  font-weight: bold;

  margin-bottom: 5px;

  text-align: center;
}

.degrees {
  font-size: clamp(18px, 2.2vw, 30px);

  opacity: 0.8;
}

.compass {
  position: relative;

  width: min(28vw, 260px);
  height: min(28vw, 260px);

  min-width: 150px;
  min-height: 150px;

  border: 4px solid white;

  border-radius: 50%;

  margin-top: 15px;
}

.compass span {
  position: absolute;

  font-weight: bold;

  font-size: 18px;
}

.north {
  top: 8px;
  left: 50%;

  transform: translateX(-50%);
}

.east {
  right: 10px;
  top: 50%;

  transform: translateY(-50%);
}

.south {
  bottom: 8px;
  left: 50%;

  transform: translateX(-50%);
}

.west {
  left: 10px;
  top: 50%;

  transform: translateY(-50%);
}

.arrow {
  position: absolute;

  left: 50%;
  top: 50%;

  width: 4px;
  height: 42%;

  background: white;

  transform-origin: center bottom;

  transform:
    translate(-50%, -100%)
    rotate(0deg);

  border-radius: 5px;
}

.arrow::before {
  content: "";

  position: absolute;

  top: -15px;
  left: 50%;

  transform: translateX(-50%);

  border-left: 11px solid transparent;
  border-right: 11px solid transparent;
  border-bottom: 22px solid white;
}

.center {
  position: absolute;

  width: 16px;
  height: 16px;

  background: white;

  border-radius: 50%;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);
}

.footer {
  min-height: 70px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-top: 1px solid #31505d;

  font-size: clamp(12px, 1.5vw, 18px);

  opacity: 0.8;

  padding: 10px;

  text-align: center;
}


/* ADATTAMENTO TELEFONO */

@media (max-width: 700px) {

  .header {
    height: 12vh;
    min-height: 60px;
  }

  .header h1 {
    font-size: 20px;
    letter-spacing: 1px;
  }

  .content {
    min-height: 72vh;
  }

  .panel {
    padding: 8px;
  }

  .value {
    font-size: 42px;
  }

  .direction {
    font-size: 24px;
  }

  .compass {
    width: 150px;
    height: 150px;

    min-width: 150px;
    min-height: 150px;

    margin-top: 10px;
  }

  .footer {
    min-height: 60px;

    font-size: 13px;
  }
}

</style>

</head>


<body>

<div class="app">


  <!-- TITOLO -->

  <div class="header">

    <h1>
      VENTO DIGA SUD CHIOGGIA
    </h1>

  </div>


  <!-- DATI -->

  <div class="content">


    <!-- VENTO MEDIO -->

    <div class="panel">

      <div class="label">
        VENTO MEDIO
      </div>

      <div
        class="value"
        id="wind">
        --
      </div>

      <div class="unit">
        nodi
      </div>

    </div>


    <!-- VENTO MAX -->

    <div class="panel">

      <div class="label">
        VENTO MAX
      </div>

      <div
        class="value"
        id="maxWind">
        --
      </div>

      <div class="unit">
        nodi
      </div>

    </div>


    <!-- DIREZIONE -->

    <div class="panel">

      <div class="label">
        DIREZIONE
      </div>

      <div
        class="direction"
        id="directionName">
        --
      </div>

      <div
        class="degrees"
        id="degrees">
        --°
      </div>


      <!-- BUSSOLA -->

      <div class="compass">

        <span class="north">
          N
        </span>

        <span class="east">
          E
        </span>

        <span class="south">
          S
        </span>

        <span class="west">
          O
        </span>


        <div
          class="arrow"
          id="arrow">
        </div>


        <div class="center">
        </div>

      </div>

    </div>

  </div>


  <!-- ORARIO -->

  <div class="footer">

    Ultimo aggiornamento:&nbsp;

    <span id="time">
      --
    </span>

  </div>


</div>


<script>

const WORKER_URL =
  "https://vento-diga-sud.riccardo172.workers.dev/";


async function aggiornaVento() {

  try {

    const response =
      await fetch(
        WORKER_URL +
        "?t=" +
        Date.now(),
        {
          cache: "no-store"
        }
      );


    const result =
      await response.json();


    if (!result.ok) {

      throw new Error(
        result.error ||
        "Errore dati"
      );

    }


    const data =
      result.data;


    /* VENTO MEDIO */

    document
      .getElementById("wind")
      .textContent =
      Number(data.windKnots)
        .toFixed(1);


    /* VENTO MAX */

    document
      .getElementById("maxWind")
      .textContent =
      Number(data.maxKnots)
        .toFixed(1);


    /* DIREZIONE */

    document
      .getElementById("directionName")
      .textContent =
      data.directionName;


    document
      .getElementById("degrees")
      .textContent =
      Math.round(
        data.direction
      ) + "°";


    /* BUSSOLA */

    document
      .getElementById("arrow")
      .style.transform =
      "translate(-50%, -100%) rotate(" +
      data.direction +
      "deg)";


    /*
      ORARIO DELLA STAZIONE

      La stazione fornisce sempre
      l'orario in CET (UTC+1).

      Europe/Rome applica automaticamente
      l'ora legale italiana quando necessario.

      Esempio estivo:
      stazione 15:50
      app       16:50

      Esempio invernale:
      stazione 15:50
      app       15:50
    */


    const parti =
      data.timestamp.split(" ");


    if (
      parti.length >= 2
    ) {

      const dataPart =
        parti[0];

      const oraPart =
        parti[1];


      const timestampCET =
        dataPart +
        "T" +
        oraPart +
        "+01:00";


      const dataOra =
        new Date(
          timestampCET
        );


      document
        .getElementById("time")
        .textContent =
        dataOra.toLocaleString(
          "it-IT",
          {
            timeZone:
              "Europe/Rome",

            day:
              "2-digit",

            month:
              "2-digit",

            year:
              "numeric",

            hour:
              "2-digit",

            minute:
              "2-digit",

            second:
              "2-digit"
          }
        );

    }


  }

  catch (error) {

    console.error(error);


    document
      .getElementById("wind")
      .textContent =
      "--";


    document
      .getElementById("maxWind")
      .textContent =
      "--";


    document
      .getElementById("directionName")
      .textContent =
      "ERRORE";


    document
      .getElementById("degrees")
      .textContent =
      "";


    document
      .getElementById("time")
      .textContent =
      "Dati non disponibili";

  }

}


/* PRIMA LETTURA */

aggiornaVento();


/* AGGIORNAMENTO OGNI 5 MINUTI */

setInterval(
  aggiornaVento,
  5 * 60 * 1000
);

</script>


</body>

</html>
