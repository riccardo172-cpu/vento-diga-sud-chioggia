```html
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vento Diga Sud Chioggia</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #071923;
  color: white;
}

.app {
  width: 100%;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

.header {
  height: 16%;
  display: flex;
  align-items: center;
  justify-content: center;
  border-bottom: 1px solid #31505d;
}

.header h1 {
  margin: 0;
  font-size: clamp(22px, 3vw, 38px);
  letter-spacing: 2px;
}

.content {
  flex: 1;
  display: flex;
  align-items: stretch;
}

.panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-right: 1px solid #31505d;
  padding: 15px;
}

.panel:last-child {
  border-right: none;
}

.label {
  font-size: clamp(14px, 1.7vw, 22px);
  letter-spacing: 2px;
  opacity: 0.75;
  margin-bottom: 10px;
}

.value {
  font-size: clamp(42px, 7vw, 85px);
  font-weight: bold;
}

.unit {
  font-size: clamp(16px, 2vw, 26px);
  opacity: 0.75;
}

.direction {
  font-size: clamp(25px, 3.5vw, 48px);
  font-weight: bold;
  margin-bottom: 5px;
}

.degrees {
  font-size: clamp(18px, 2.2vw, 30px);
  opacity: 0.8;
}

.compass {
  position: relative;
  width: min(28vw, 260px);
  height: min(28vw, 260px);
  min-width: 150px;
  min-height: 150px;
  border: 4px solid white;
  border-radius: 50%;
  margin-top: 15px;
}

.compass span {
  position: absolute;
  font-weight: bold;
  font-size: 18px;
}

.north {
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
}

.east {
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
}

.south {
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
}

.west {
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
}

.arrow {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 4px;
  height: 42%;
  background: white;
  transform-origin: center bottom;
  transform: translate(-50%, -100%) rotate(0deg);
  border-radius: 5px;
}

.arrow::before {
  content: "";
  position: absolute;
  top: -15px;
  left: 50%;
  transform: translateX(-50%);
  border-left: 11px solid transparent;
  border-right: 11px solid transparent;
  border-bottom: 22px solid white;
}

.center {
  position: absolute;
  width: 16px;
  height: 16px;
  background: white;
  border-radius: 50%;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
}

.footer {
  height: 12%;
  display: flex;
  align-items: center;
  justify-content: center;
  border-top: 1px solid #31505d;
  font-size: clamp(12px, 1.5vw, 18px);
  opacity: 0.7;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <h1>VENTO DIGA SUD CHIOGGIA</h1>
  </div>

  <div class="content">

    <!-- VENTO MINIMO -->
    <div class="panel">
      <div class="label">VENTO MINIMO</div>
      <div class="value" id="wind">--</div>
      <div class="unit">nodi</div>
    </div>

    <!-- VENTO MASSIMO -->
    <div class="panel">
      <div class="label">VENTO MAX</div>
      <div class="value" id="maxWind">--</div>
      <div class="unit">nodi</div>
    </div>

    <!-- DIREZIONE -->
    <div class="panel">

      <div class="label">DIREZIONE</div>

      <div class="direction" id="directionName">--</div>

      <div class="degrees" id="degrees">--°</div>

      <div class="compass">

        <span class="north">N</span>
        <span class="east">E</span>
        <span class="south">S</span>
        <span class="west">O</span>

        <div class="arrow" id="arrow"></div>

        <div class="center"></div>

      </div>

    </div>

  </div>

  <div class="footer">
    Ultimo aggiornamento: <span id="time">--</span>
  </div>

</div>

<script>

const WORKER_URL =
  "https://vento-diga-sud.riccardo172.workers.dev/";

async function aggiornaVento() {

  try {

    const response = await fetch(
      WORKER_URL + "?t=" + Date.now(),
      {
        cache: "no-store"
      }
    );

    const result = await response.json();

    if (!result.ok) {
      throw new Error(result.error || "Errore dati");
    }

    const data = result.data;

    // VENTO MINIMO
    document.getElementById("wind").textContent =
      data.minKnots.toFixed(1);

    // VENTO MASSIMO
    document.getElementById("maxWind").textContent =
      data.maxKnots.toFixed(1);

    // DIREZIONE
    document.getElementById("directionName").textContent =
      data.directionName;

    document.getElementById("degrees").textContent =
      Math.round(data.direction) + "°";

    // FRECCIA BUSSOLA
    document.getElementById("arrow").style.transform =
      "translate(-50%, -100%) rotate(" +
      data.direction +
      "deg)";

    // ORARIO ITALIANO
    // Il dato del Comune è in UTC.
    // Europe/Rome gestisce automaticamente CET in inverno
    // e CEST in estate.
    const dataUTC = new Date(
      data.timestamp.replace(" ", "T") + "Z"
    );

    document.getElementById("time").textContent =
      dataUTC.toLocaleString("it-IT", {
        timeZone: "Europe/Rome",
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });

  }

  catch (error) {

    console.error(error);

    document.getElementById("wind").textContent = "--";
    document.getElementById("maxWind").textContent = "--";
    document.getElementById("directionName").textContent = "ERRORE";
    document.getElementById("degrees").textContent = "";
    document.getElementById("time").textContent =
      "Dati non disponibili";
  }
}


// Prima lettura
aggiornaVento();


// Aggiornamento ogni 5 minuti
setInterval(
  aggiornaVento,
  5 * 60 * 1000
);

</script>

</body>
</html>
