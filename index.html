<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Vento Diga Sud Chioggia</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  background: #071522;
  color: white;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  background:
    radial-gradient(circle at 50% 0%, #123b56 0%, #071522 45%, #040d14 100%);
}

.app {
  width: 100%;
  max-width: 520px;
  min-height: 100vh;
  padding: 22px 18px 18px;
  display: flex;
  flex-direction: column;
}

/* TITOLO */

.header {
  text-align: center;
  margin-bottom: 22px;
}

.header .small {
  font-size: 12px;
  letter-spacing: 3px;
  color: #75b9d8;
  margin-bottom: 6px;
}

.header h1 {
  margin: 0;
  font-size: 25px;
  letter-spacing: 1.5px;
  font-weight: 700;
}

.header .location {
  margin-top: 6px;
  font-size: 13px;
  color: #8ca5b5;
}

/* RIQUADRI VENTO */

.wind-boxes {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.wind-box {
  background: rgba(17, 42, 57, 0.88);
  border: 1px solid rgba(93, 166, 199, 0.25);
  border-radius: 18px;
  padding: 17px 12px;
  text-align: center;
  box-shadow: 0 8px 25px rgba(0,0,0,0.25);
}

.wind-label {
  font-size: 11px;
  letter-spacing: 2px;
  color: #7fb9d5;
  font-weight: bold;
}

.wind-value {
  margin-top: 7px;
  font-size: 38px;
  line-height: 1;
  font-weight: 700;
}

.wind-unit {
  font-size: 13px;
  color: #9eb4c1;
  margin-top: 5px;
}

.wind-ms {
  font-size: 12px;
  color: #6f8b9b;
  margin-top: 7px;
}

/* BUSSOLA */

.compass-section {
  margin-top: 22px;
  background: rgba(10, 30, 43, 0.82);
  border: 1px solid rgba(93, 166, 199, 0.22);
  border-radius: 22px;
  padding: 20px 15px 18px;
  text-align: center;
  box-shadow: 0 8px 30px rgba(0,0,0,0.25);
}

.direction-title {
  font-size: 11px;
  letter-spacing: 2px;
  color: #7fb9d5;
  font-weight: bold;
  margin-bottom: 14px;
}

.compass {
  width: min(65vw, 270px);
  height: min(65vw, 270px);
  max-width: 270px;
  max-height: 270px;
  min-width: 210px;
  min-height: 210px;
  margin: auto;
  position: relative;
  border-radius: 50%;
  border: 2px solid rgba(137, 190, 215, 0.45);
  background:
    radial-gradient(circle,
      rgba(30, 74, 97, 0.65) 0%,
      rgba(8, 28, 42, 0.9) 68%,
      rgba(4, 15, 23, 1) 100%);
  box-shadow:
    inset 0 0 25px rgba(0,0,0,0.5),
    0 0 25px rgba(49, 139, 177, 0.12);
}

/* cerchi interni */

.compass::before {
  content: "";
  position: absolute;
  inset: 12%;
  border-radius: 50%;
  border: 1px solid rgba(126, 181, 207, 0.18);
}

.compass::after {
  content: "";
  position: absolute;
  inset: 24%;
  border-radius: 50%;
  border: 1px solid rgba(126, 181, 207, 0.12);
}

/* PUNTI CARDINALI */

.cardinal {
  position: absolute;
  font-size: 13px;
  font-weight: bold;
  color: #b8d6e4;
  z-index: 4;
}

.north {
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
}

.south {
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
}

.west {
  left: 11px;
  top: 50%;
  transform: translateY(-50%);
}

.east {
  right: 11px;
  top: 50%;
  transform: translateY(-50%);
}

/* TACCHETTE */

.tick {
  position: absolute;
  width: 2px;
  height: 8px;
  background: rgba(155, 199, 217, 0.55);
  left: 50%;
  top: 6px;
  transform-origin: 50% calc((min(65vw, 270px) / 2) - 6px);
}

/* FRECCIA */

.arrow-container {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
}

.arrow {
  width: 0;
  height: 0;
  border-left: 11px solid transparent;
  border-right: 11px solid transparent;
  border-bottom: 92px solid #63c4ed;
  filter: drop-shadow(0 0 7px rgba(74,190,235,0.65));
  transform-origin: 50% 50%;
  position: relative;
  z-index: 5;
}

.arrow::after {
  content: "";
  position: absolute;
  left: -11px;
  top: 88px;
  width: 0;
  height: 0;
  border-left: 11px solid transparent;
  border-right: 11px solid transparent;
  border-top: 25px solid rgba(99,196,237,0.25);
}

/* CENTRO */

.compass-center {
  position: absolute;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #d8f4ff;
  border: 4px solid #2b7799;
  z-index: 7;
  box-shadow: 0 0 12px rgba(99,196,237,0.6);
}

.direction-name {
  margin-top: 17px;
  font-size: 25px;
  font-weight: 700;
  letter-spacing: 2px;
}

.direction-degrees {
  margin-top: 4px;
  font-size: 15px;
  color: #91b6c8;
}

/* STATO */

.status {
  margin-top: 18px;
  text-align: center;
}

.live {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 7px 13px;
  border-radius: 20px;
  background: rgba(42, 132, 163, 0.13);
  border: 1px solid rgba(86, 174, 207, 0.18);
  color: #7fc5df;
  font-size: 11px;
  letter-spacing: 1px;
}

.live-dot {
  width: 7px;
  height: 7px;
  background: #4fc3df;
  border-radius: 50%;
  box-shadow: 0 0 8px #4fc3df;
}

/* STATO DI AVVISO */

.live.warning {
  color: #f0b85a;
  background: rgba(180, 120, 20, 0.12);
  border-color: rgba(240, 184, 90, 0.25);
}

.live.warning .live-dot {
  background: #f0b85a;
  box-shadow: 0 0 8px #f0b85a;
}

/* STATO DI ERRORE */

.live.error {
  color: #ff7373;
  background: rgba(180, 40, 40, 0.12);
  border-color: rgba(255, 100, 100, 0.25);
}

.live.error .live-dot {
  background: #ff7373;
  box-shadow: 0 0 8px #ff7373;
}

/* FOOTER */

.footer {
  margin-top: auto;
  padding-top: 20px;
  text-align: center;
  color: #607987;
  font-size: 10px;
  line-height: 1.6;
}

.footer strong {
  color: #8099a7;
  font-weight: normal;
}

/* SCHERMI MOLTO PICCOLI */

@media (max-height: 700px) {

  .app {
    padding-top: 14px;
  }

  .header {
    margin-bottom: 14px;
  }

  .compass-section {
    margin-top: 14px;
    padding-top: 14px;
    padding-bottom: 12px;
  }

  .compass {
    min-width: 180px;
    min-height: 180px;
    width: min(55vw, 220px);
    height: min(55vw, 220px);
  }

  .direction-name {
    margin-top: 10px;
  }

  .arrow {
    border-bottom-width: 72px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="small">STAZIONE METEOROLOGICA</div>
    <h1>VENTO DIGA SUD</h1>
    <div class="location">Chioggia · Sottomarina</div>
  </div>

  <div class="wind-boxes">

    <div class="wind-box">
      <div class="wind-label">VENTO MEDIO</div>
      <div class="wind-value" id="windKnots">--</div>
      <div class="wind-unit">kn</div>
      <div class="wind-ms">
        <span id="windMs">--</span> m/s
      </div>
    </div>

    <div class="wind-box">
      <div class="wind-label">VENTO MAX</div>
      <div class="wind-value" id="maxKnots">--</div>
      <div class="wind-unit">kn</div>
      <div class="wind-ms">
        <span id="maxMs">--</span> m/s
      </div>
    </div>

  </div>

  <div class="compass-section">

    <div class="direction-title">DIREZIONE DEL VENTO</div>

    <div class="compass" id="compass">

      <div class="cardinal north">N</div>
      <div class="cardinal east">E</div>
      <div class="cardinal south">S</div>
      <div class="cardinal west">O</div>

      <div class="arrow-container">
        <div class="arrow" id="arrow"></div>
      </div>

      <div class="compass-center"></div>

    </div>

    <div class="direction-name" id="directionName">
      --
    </div>

    <div class="direction-degrees">
      <span id="directionDegrees">--</span>°
    </div>

  </div>

  <div class="status">
    <div class="live">
      <span class="live-dot"></span>
      DATI AGGIORNATI
    </div>
  </div>

  <div class="footer">
    <strong>Ultimo aggiornamento:</strong><br>
    <span id="timestamp">--</span>
    <br>
    Dati: Comune di Venezia · Diga Sud Chioggia
  </div>

</div>

<script>

const WORKER_URL =
  "https://vento-diga-sud.riccardo172.workers.dev/";


function formatTimestamp(timestamp) {

  if (!timestamp) {
    return "--";
  }

  // La stazione del Comune utilizza sempre UTC+1.
  const fixedCET =
    timestamp.replace(" ", "T") + "+01:00";

  const date =
    new Date(fixedCET);

  if (isNaN(date.getTime())) {
    return timestamp;
  }

  return date.toLocaleString("it-IT", {
    timeZone: "Europe/Rome",
    day: "2-digit",
    month: "2-digit",
    year: "numeric",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit"
  });
}


function getTimestampDate(timestamp) {

  if (!timestamp) {
    return null;
  }

  // La stazione del Comune utilizza sempre UTC+1.
  const fixedCET =
    timestamp.replace(" ", "T") + "+01:00";

  const date =
    new Date(fixedCET);

  if (isNaN(date.getTime())) {
    return null;
  }

  return date;
}


function clearWindValues() {

  document.getElementById("windKnots").textContent =
    "--";

  document.getElementById("windMs").textContent =
    "--";

  document.getElementById("maxKnots").textContent =
    "--";

  document.getElementById("maxMs").textContent =
    "--";

  document.getElementById("directionName").textContent =
    "--";

  document.getElementById("directionDegrees").textContent =
    "--";

  document.getElementById("arrow").style.transform =
    "rotate(0deg)";
}


function setStatus(type, text) {

  const status =
    document.querySelector(".live");

  status.classList.remove("warning");
  status.classList.remove("error");

  status.textContent = "";

  const dot =
    document.createElement("span");

  dot.className = "live-dot";

  status.appendChild(dot);

  status.appendChild(
    document.createTextNode(text)
  );

  if (type === "warning") {
    status.classList.add("warning");
  }

  if (type === "error") {
    status.classList.add("error");
  }
}


async function loadData() {

  try {

    const response =
      await fetch(
        WORKER_URL + "?t=" + Date.now(),
        {
          cache: "no-store"
        }
      );

    if (!response.ok) {

      throw new Error(
        "Errore HTTP " + response.status
      );

    }

    const result =
      await response.json();

    if (!result.ok) {

      throw new Error(
        result.error || "Errore dati"
      );

    }

    const data =
      result.data;


    /* CONTROLLO VALORI NUMERICI */

    const windKnots =
      Number(data.windKnots);

    const windMs =
      Number(data.windMs);

    const maxKnots =
      Number(data.maxKnots);

    const maxMs =
      Number(data.maxMs);

    const direction =
      Number(data.direction);


    if (
      !Number.isFinite(windKnots) ||
      !Number.isFinite(windMs) ||
      !Number.isFinite(maxKnots) ||
      !Number.isFinite(maxMs) ||
      !Number.isFinite(direction)
    ) {

      throw new Error(
        "Dati vento non validi"
      );

    }


    /* CONTROLLO TIMESTAMP */

    const dataDate =
      getTimestampDate(
        data.timestamp
      );


    if (!dataDate) {

      throw new Error(
        "Timestamp non valido"
      );

    }


    /*
      Calcoliamo quanti minuti sono passati
      dalla registrazione della stazione.
    */

    const ageMinutes =
      (Date.now() - dataDate.getTime()) / 60000;


    /*
      Il dato viene considerato non affidabile se:

      - è nel futuro
      - oppure è più vecchio di 15 minuti
    */

    if (
      ageMinutes < 0 ||
      ageMinutes > 15
    ) {

      clearWindValues();

      document.getElementById("timestamp").textContent =
        formatTimestamp(
          data.timestamp
        );

      setStatus(
        "warning",
        "DATI NON AGGIORNATI"
      );

      return;
    }


    /* DATI VALIDI */

    document.getElementById("windKnots").textContent =
      windKnots.toFixed(1);

    document.getElementById("windMs").textContent =
      windMs.toFixed(1);

    document.getElementById("maxKnots").textContent =
      maxKnots.toFixed(1);

    document.getElementById("maxMs").textContent =
      maxMs.toFixed(1);

    document.getElementById("directionName").textContent =
      data.directionName || "--";

    document.getElementById("directionDegrees").textContent =
      Math.round(direction);

    document.getElementById("arrow").style.transform =
      "rotate(" + direction + "deg)";

    document.getElementById("timestamp").textContent =
      formatTimestamp(
        data.timestamp
      );

    setStatus(
      "ok",
      "DATI AGGIORNATI"
    );


  } catch (error) {

    console.error(error);

    /*
      In caso di errore cancelliamo anche
      i dati precedentemente visualizzati.
    */

    clearWindValues();

    setStatus(
      "error",
      "ERRORE DATI"
    );

  }

}


// PRIMO CARICAMENTO

loadData();


// AGGIORNAMENTO AUTOMATICO OGNI 5 MINUTI

setInterval(
  loadData,
  5 * 60 * 1000
);

</script>

</body>
</html>
